services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "true"
    volumes:
      - app_data:/app/data
    # Not exposed to the host directly -- only Caddy talks to it, over TLS to the outside.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
